dependencies:
  idf: ">=5.1"
  # esp_tinyusb had a breaking API change between 1.x and 2.x/3.x (the
  # tinyusb_config_t layout moved to nested .descriptor/.phy/.task fields
  # and gained the TINYUSB_DEFAULT_CONFIG() macro). main.c targets that
  # newer API, so this pin requires it.
  espressif/esp_tinyusb: "^3.0.0"
